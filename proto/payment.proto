syntax = "proto3";

package payment;

service PaymentService {
  rpc ProcessPayment (ProcessPaymentRequest) returns (PaymentResponse);
  rpc RefundPayment (RefundPaymentRequest) returns (RefundResponse);
  rpc GetPayment (GetPaymentRequest) returns (PaymentResponse);
}

message ProcessPaymentRequest {
  string booking_id = 1;
  string user_id = 2;
  double amount = 3;
  string currency = 4;
  string stripe_token = 5;
}

message RefundPaymentRequest {
  string payment_id = 1;
  string reason = 2;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message PaymentResponse {
  string payment_id = 1;
  string booking_id = 2;
  string user_id = 3;
  double amount = 4;
  string currency = 5;
  string status = 6;
  string stripe_charge_id = 7;
  string created_at = 8;
}

message RefundResponse {
  string payment_id = 1;
  string status = 2;
  double refund_amount = 3;
  string message = 4;
}
