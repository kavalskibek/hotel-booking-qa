name: API Tests


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  test:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4



      - name: Set up Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt


      - name: Start services
        run: docker-compose -f ../hotel-booking-service/docker-compose.yml up -d

      - name: Wait for services
        run: sleep 30

      - name: Generate proto files
        run: |
          mkdir -p generated
          python -m grpc_tools.protoc -I./proto --python_out=./generated --grpc_python_out=./generated ./proto/booking.proto
          python -m grpc_tools.protoc -I./proto --python_out=./generated --grpc_python_out=./generated ./proto/search.proto

      - name: Run smoke tests
        run: pytest tests/ -v -m smoke --alluredir=allure-results

      - name: Run all tests
        run: pytest tests/ -v --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/